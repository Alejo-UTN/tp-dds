name: CI/CD - Docker, GHCR, Docker Hub y Render

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Obtener el SHA corto del commit
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Convertir nombre de usuario a minúsculas
        run: echo "REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/dds-devops:latest
            ghcr.io/${{ env.REPO_OWNER }}/dds-devops:${{ env.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dds-devops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dds-devops:${{ env.sha_short }}

      - name: Disparar despliegue en Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
